<!doctype html>
<html><meta charset='utf-8'>
<title>AI Company 001 v0.5.2</title>
<h1>AI Company 001 v0.5.2</h1>
<h2>老板任务</h2>
<input id='goal' value='寻找一个AI创业机会'>
<button onclick='start()'>发送给CEO</button>

<h2>AI员工</h2>
<div id='agents'></div>

<h2>公司动态</h2>
<div id='log'></div>

<script>
function start(){
 fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:document.getElementById('goal').value})}).then(load)
}
function load(){
 fetch('/api/dashboard').then(r=>r.json()).then(d=>{
 document.getElementById('agents').innerHTML=JSON.stringify(d.agents)
 document.getElementById('log').innerHTML=d.activities.join('<br>')
 })
}
setInterval(load,3000);load()
</script>
